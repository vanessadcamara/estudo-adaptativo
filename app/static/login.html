<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Entrar · Estudo Adaptativo BB</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="login-shell">
    <section class="panel login-card">
      <div class="eyebrow">SEU CADERNO DE ESTUDOS</div>
      <h1>Estudo Adaptativo <span>BB</span></h1>
      <p>Entre para acessar suas revisões, questões e progresso.</p>
      <form id="loginForm" class="stack-form">
        <label>Usuário <input name="username" autocomplete="username" maxlength="120" required autofocus /></label>
        <label>Senha <input name="password" type="password" autocomplete="current-password" required /></label>
        <button type="submit" class="primary">Entrar no sistema</button>
      </form>
      <div id="loginMessage" class="message error" role="alert" hidden></div>
      <p class="hint">Seus registros de estudo são privados e permanecem no PostgreSQL.</p>
    </section>
  </main>
  <script src="/static/login.js" defer></script>
</body>
</html>
